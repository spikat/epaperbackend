name: Epaper Weather
refresh_interval: 30
strategy: polling
polling_verb: get
polling_url: "{{ backend_url }}/weather?country={{ country }}&city={{ city }}"
custom_fields:
  - keyname: backend_url
    field_type: text
    default: http://127.0.0.1:5678
    label: Backend URL
  - keyname: country
    field_type: text
    default: FR
    label: Country (ISO)
  - keyname: city
    field_type: text
    default: Marseille
    label: City or postal code
